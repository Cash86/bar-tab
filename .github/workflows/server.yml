name: server

on:
  pull_request:
    paths: [server/**, api/**, .github/workflows/server.yml]
  push:
    branches: [main]
    paths: [server/**, api/**, .github/workflows/server.yml]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "server[dev]"
        working-directory: .
      - run: pytest
      - run: ruff check .
      - run: ruff format --check .
