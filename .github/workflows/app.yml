name: app

on:
  pull_request:
    paths:
      - "app/**"
      - "api/**"
      - ".github/workflows/app.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "api/**"
      - ".github/workflows/app.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true
      - run: tool/check.sh
