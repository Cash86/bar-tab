services:
  server:
    build: ./server
    image: bartab-server:latest
    restart: unless-stopped
    env_file: .env
    environment:
      # Inside the container the data volume is always /data.
      BARTAB_DB_PATH: /data/bartab.db
      BARTAB_DATA_DIR: /data
    volumes:
      - ./data:/data
    # Traefik drops unhealthy backends. python:3.12-slim has no curl, so use the stdlib.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
